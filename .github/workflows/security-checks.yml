name: security-checks

on:
  pull_request:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      publicar:
        description: Publicar el ZIP de la versión comprobada desde main
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  python-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install backend and audit dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install bandit pip-audit pytest pyyaml rdflib

      - name: Static repository configuration checks
        run: python scripts/security_static_check.py

      - name: Bandit static analysis
        run: bandit -r backend/app -ll

      - name: pip-audit dependencies
        run: pip-audit -r backend/requirements.txt

      - name: Unit tests
        env:
          PYTHONPATH: backend
        run: pytest -q

  windows-dependencies:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install backend on Windows
        run: python -m pip install -r backend/requirements.txt

      - name: Install test dependencies
        run: python -m pip install pytest pyyaml rdflib

      - name: Unit tests on Windows
        env:
          PYTHONPATH: backend
        run: python -m pytest -q

      - name: Validate Windows scripts and package
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in Get-ChildItem -Recurse -Filter *.ps1) {
            $tokens = $null
            $errors = $null
            [void][Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors)
            if ($errors) { throw ($errors -join "\n") }
          }
          python scripts/empaquetar_windows.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $zip = Get-Item dist/*.zip
          $esperado = ((Get-Content ($zip.FullName + '.sha256')) -split ' ')[0]
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne $esperado) { throw 'SHA-256 incorrecto' }
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP/pluma-zip
          $raiz = Get-ChildItem $env:RUNNER_TEMP/pluma-zip -Directory
          if ((Get-Content ($raiz.FullName + '/REVISION.txt')) -notcontains "https://github.com/$env:GITHUB_REPOSITORY/commit/$env:GITHUB_SHA") { throw 'ZIP de otro commit' }

  container-scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        servicio: [app, ollama]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build PlumA image
        if: matrix.servicio == 'app'
        run: docker compose build app
      - name: Run real Spanish and English OCR in the runtime image
        if: matrix.servicio == 'app'
        run: |
          app="$(docker compose config --format json | jq -er '.services.app.image')"
          docker run --rm -i --network none "$app" python - <<'PYTHON'
          import io
          from PIL import Image, ImageDraw, ImageFont
          from app.router import _ocr_imagen_tesseract
          imagen = Image.new("RGB", (600, 100), "white")
          ImageDraw.Draw(imagen).text((15, 15), "DOCUMENTO LOCAL 2026", fill="black", font=ImageFont.load_default(size=38))
          datos = io.BytesIO()
          imagen.save(datos, format="PNG")
          assert "DOCUMENTO" in _ocr_imagen_tesseract(datos.getvalue()).upper()
          PYTHON
      - name: Select exact image from Compose
        id: image
        env:
          SERVICE: ${{ matrix.servicio }}
        run: |
          ref="$(docker compose --profile bundled config --format json | jq -er --arg s "$SERVICE" '.services[$s].image')"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          format: json
          output: trivy-results.json
          severity: MEDIUM,HIGH,CRITICAL
          scanners: vuln
          timeout: 30m
      - name: Enforce published release policy
        run: |
          jq -er '.Results | type == "array" and length > 0' trivy-results.json
          jq '[.Results[].Vulnerabilities[]? | select(.Severity == "CRITICAL" or
            ((.Severity == "HIGH" or .Severity == "MEDIUM") and (.FixedVersion // "") != "")) |
            {VulnerabilityID, PkgName, InstalledVersion, FixedVersion, Severity}]' trivy-results.json > bloqueantes.json
          cat bloqueantes.json
          jq -e 'length == 0' bloqueantes.json
      - name: Archive image analysis
        if: always() && hashFiles('trivy-results.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-${{ matrix.servicio }}
          path: trivy-results.json

  inferencia-local:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        modo: [host, bundled]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install packet capture utility
        run: command -v tcpdump || (sudo apt-get update -qq && sudo apt-get install -y tcpdump)
      - name: Verify real local text and image inference and observe both endpoints
        env:
          GH_TOKEN: ${{ github.token }}
          MODO: ${{ matrix.modo }}
        run: bash scripts/verificar_inferencia_local.sh "$MODO"

  publicar-windows:
    needs: [python-security, windows-dependencies, container-scan, inferencia-local]
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' && inputs.publicar) ||
       (github.event_name == 'push' && contains(github.event.head_commit.message, '[publicar-windows]')))
    permissions:
      contents: write
    runs-on: ubuntu-latest
    concurrency: publicar-windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Publish Windows ZIP and checksum from the verified commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(PYTHONPATH=backend python -c 'from app.version import APP_VERSION; print(APP_VERSION)')"
          tag="Pluma.$version"
          python scripts/empaquetar_windows.py --ref "$GITHUB_SHA"
          (cd dist && sha256sum -c *.sha256)
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "La publicación $tag ya existe. Se conserva intacta."
            exit 1
          fi
          gh release create "$tag" --draft --target "$GITHUB_SHA" --title "PlumA $version" --notes-file "releases/$version.md" dist/*.zip dist/*.sha256
          gh release edit "$tag" --draft=false
