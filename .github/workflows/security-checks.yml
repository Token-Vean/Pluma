name: security-checks

on:
  pull_request:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install backend and audit dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install bandit pip-audit pytest pyyaml

      - name: Static repository configuration checks
        run: python scripts/security_static_check.py

      - name: Bandit static analysis
        run: bandit -r backend/app -ll

      - name: pip-audit dependencies
        run: pip-audit -r backend/requirements.txt

      - name: Unit tests
        env:
          PYTHONPATH: backend
        run: pytest -q

  windows-dependencies:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install backend on Windows
        run: python -m pip install -r backend/requirements.txt

      - name: Install test dependencies
        run: python -m pip install pytest pyyaml

      - name: Unit tests on Windows
        env:
          PYTHONPATH: backend
        run: python -m pytest -q

  container-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build local image
        run: docker compose build app

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'pluma-app:0.7.1'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'
